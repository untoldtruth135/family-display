name: Usage validation
on:
  push:
    branches: [usage-quota-savings]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: usage-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Offline regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Next.js build and type checks
        run: npm run build
# Deliberately no deployment step, production secrets, or live database calls.

