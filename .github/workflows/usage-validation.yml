name: Usage validation
on:
  push:
    branches: [usage-quota-savings, fix-weather-freshness]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: usage-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Offline regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Next.js build and type checks
        run: npm run build
      - name: Install isolated browser test tools
        env:
          PLAYWRIGHT_PACKAGE_ROOT: ${{ runner.temp }}/fd-browser
        run: |
          npm install --prefix "$PLAYWRIGHT_PACKAGE_ROOT" --no-save --package-lock=false playwright@1.58.2
          node "$PLAYWRIGHT_PACKAGE_ROOT/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
      - name: TV weather layout regression
        env:
          PLAYWRIGHT_PACKAGE_ROOT: ${{ runner.temp }}/fd-browser
        run: node tests/tv-weather-layout.browser.mjs
      - name: Weather refresh and recovery regression
        env:
          PLAYWRIGHT_PACKAGE_ROOT: ${{ runner.temp }}/fd-browser
        run: node tests/weather-refresh.browser.mjs
      - name: Save TV layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-weather-layout
          path: artifacts/weather-layout/
          if-no-files-found: ignore
          retention-days: 7
# Deliberately no deployment step, production secrets, or live database calls.

